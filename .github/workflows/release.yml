name: Build & Release APK

# Triggers automatically when you push a version tag like v2.9.9
# To trigger: git tag v2.9.9 && git push origin v2.9.9
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle) ─────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      # ── 4. Decode secrets → files ────────────────────────────────────────
      # Store these in GitHub → Settings → Secrets and variables → Actions:
      #   KEYSTORE_BASE64       — base64 of smartspend-release.jks
      #   KEY_PROPERTIES        — full content of android/key.properties
      #   GOOGLE_SERVICES_JSON  — full content of android/app/google-services.json
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/smartspend-release.jks

      - name: Write key.properties
        run: echo "${{ secrets.KEY_PROPERTIES }}" | base64 --decode > android/key.properties

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      # ── 5. Create app_config.dart (API keys) ────────────────────────────
      # APP_CONFIG_DART is stored as base64 to preserve quotes and special chars.
      # To regenerate the secret value run:
      #   $bytes = [IO.File]::ReadAllBytes("lib/services/app_config.dart")
      #   [Convert]::ToBase64String($bytes, [Base64FormattingOptions]::None) | clip
      - name: Write app_config.dart
        run: echo "${{ secrets.APP_CONFIG_DART }}" | base64 --decode > lib/services/app_config.dart

      # ── 6. Get dependencies ──────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Build release APKs ────────────────────────────────────────────
      - name: Build release APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --shrink \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── 8. Rename APKs to versioned names ───────────────────────────────
      - name: Rename APKs
        run: |
          TAG="${{ github.ref_name }}"
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk    SmartSpend-${TAG}-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk  SmartSpend-${TAG}-armeabi-v7a.apk
          cp app-x86_64-release.apk       SmartSpend-${TAG}-x86_64.apk

      # ── 9. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartSpend ${{ github.ref_name }}
          body: |
            ## SmartSpend ${{ github.ref_name }}

            **Automated release** — built from tag `${{ github.ref_name }}` on `${{ github.sha }}`.

            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for full changes.

            ### Install
            | Device | APK |
            |--------|-----|
            | Modern phones (2018+) | `SmartSpend-${{ github.ref_name }}-arm64-v8a.apk` |
            | Older/32-bit phones | `SmartSpend-${{ github.ref_name }}-armeabi-v7a.apk` |
            | Emulator | `SmartSpend-${{ github.ref_name }}-x86_64.apk` |
          files: |
            build/app/outputs/flutter-apk/SmartSpend-${{ github.ref_name }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/SmartSpend-${{ github.ref_name }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/SmartSpend-${{ github.ref_name }}-x86_64.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
